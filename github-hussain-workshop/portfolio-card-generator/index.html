<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Card Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Portfolio Card Generator</h1>
            <p>Create your stunning portfolio card in seconds</p>
        </div>
        <div class="main-content">
            <div class="form-section">
                <h2 class="section-title">Your Details</h2>
                <form>
                    <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" placeholder="John Doe"></div>
                    <div class="form-group"><label for="role">Role / Title</label><input type="text" id="role" placeholder="Full Stack Developer"></div>
                    <div class="form-group"><label for="bio">About / Bio</label><textarea id="bio" placeholder="Passionate developer with 5+ years of experience building web applications..."></textarea></div>
                    <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="john@example.com"></div>
                    <div class="form-group"><label for="social">Social Link</label><input type="text" id="social" placeholder="github.com/johndoe"></div>
                    <div class="form-group"><label for="image">Profile Image</label><input type="file" id="image" accept="image/*"></div>
                </form>
            </div>
            <div class="preview-section">
                <h2 class="section-title">Live Preview</h2>
                <div class="card-preview" id="cardPreview">
                    <div class="card-content">
                        <div class="card-header">
                            <div class="card-image-container" id="cardImageContainer"><span class="card-image-placeholder">👤</span></div>
                            <div class="card-info">
                                <div class="card-name" id="cardName">Your Name</div>
                                <div class="card-role" id="cardRole">Your Role</div>
                            </div>
                        </div>
                        <div class="card-bio" id="cardBio">Tell us about yourself and what makes you unique...</div>
                        <div class="card-contact">
                            <div class="card-contact-item" id="cardEmail"><span>your@email.com</span></div>
                            <div class="card-contact-item" id="cardSocial"><span>your-social-link</span></div>
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                </div>
                </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
